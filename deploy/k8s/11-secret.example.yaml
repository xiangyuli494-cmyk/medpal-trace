# 复制成 11-secret.yaml 后填真值，**不要提交**（.gitignore 已挡 deploy/k8s/*secret*.yaml，
# 只有本例文件 *.secret.example.yaml 例外）。
#   kubectl -n medpal create secret generic medpal-api --from-env-file=deploy/k8s/medpal.env
# 或直接改本文件后 kubectl apply -f。
apiVersion: v1
kind: Secret
metadata:
  name: medpal-api
  namespace: medpal
type: Opaque
stringData:
  MEDPAL_LLM_API_KEY: ""
  # RDS for PostgreSQL 的公网/内网 DSN 二选一；容器在 VPC 内用内网地址更快且不计流量费
  MEDPAL_DB_DSN: ""
  HUAWEI_PROJECT_ID: ""
  HUAWEI_AK: ""
  HUAWEI_SK: ""
