# 复制到上级目录的 11-secret.yaml 后填真值，**不要提交**（.gitignore 已挡 deploy/k8s/*secret*.yaml，
# 只有本例文件 *.secret.example.yaml 例外）。
#   kubectl -n medpal create secret generic medpal-api --from-env-file=deploy/k8s/medpal.env
# 或只应用填好真值的 11-secret.yaml，不能应用此空示例。
# 示例保存在 examples/ 中：kubectl apply -f deploy/k8s/ 不递归处理它，避免清空现有 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: medpal-api
  namespace: medpal
type: Opaque
stringData:
  MEDPAL_LLM_API_KEY: ""
  # RDS for PostgreSQL 的公网/内网 DSN 二选一；容器在 VPC 内用内网地址更快且不计流量费
  MEDPAL_DB_DSN: ""
  HUAWEI_PROJECT_ID: ""
  HUAWEI_AK: ""
  HUAWEI_SK: ""
